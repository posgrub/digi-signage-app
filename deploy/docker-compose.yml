services:
  cms-db:
    image: mysql:8.4
    volumes:
      - cms-db-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=cms
      - MYSQL_USER=cms
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Xib0_CMS_Pr0d_2026}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    restart: always

  cms-xmr:
    image: ghcr.io/xibosignage/xibo-xmr:1.3
    ports:
      - "9505:9505"
    restart: always

  cms-web:
    image: ghcr.io/xibosignage/xibo-cms:release-4.4.2
    volumes:
      - cms-custom:/var/www/cms/custom
      - cms-backup:/var/www/backup
      - cms-theme-custom:/var/www/cms/web/theme/custom
      - cms-library:/var/www/cms/library
      - cms-userscripts:/var/www/cms/web/userscripts
      - cms-ca-certs:/var/www/cms/ca-certs
    restart: always
    environment:
      - MYSQL_HOST=cms-db
      - MYSQL_DATABASE=cms
      - MYSQL_USER=cms
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Xib0_CMS_Pr0d_2026}
      - XMR_HOST=cms-xmr
      - CMS_USE_MEMCACHED=true
      - MEMCACHED_HOST=cms-memcached
      - CMS_SERVER_NAME=${CMS_SERVER_NAME:-menus.poseztech.com}
      - CMS_DEV_MODE=false
      - CMS_PHP_TIMEZONE=America/Chicago
    depends_on:
      - cms-db
      - cms-xmr
      - cms-memcached

  cms-memcached:
    image: memcached:alpine
    command: memcached -m 15
    restart: always

  cms-quickchart:
    image: ianw/quickchart
    restart: always

volumes:
  cms-db-data:
  cms-custom:
  cms-backup:
  cms-theme-custom:
  cms-library:
  cms-userscripts:
  cms-ca-certs:
