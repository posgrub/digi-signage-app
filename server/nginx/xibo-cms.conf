# Nginx reverse proxy for Xibo CMS
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
#
# Requires: certbot for Let's Encrypt SSL
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d menus.poseztech.com

server {
    listen 80;
    server_name menus.poseztech.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name menus.poseztech.com;

    # SSL - managed by certbot (paths updated automatically)
    ssl_certificate /etc/letsencrypt/live/menus.poseztech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/menus.poseztech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upload size (match CMS settings)
    client_max_body_size 2G;

    # Proxy to Xibo CMS container
    location / {
        proxy_pass http://127.0.0.1:9505;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for XMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large uploads
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
